#
# amiga-j2me: CLDC-HI platform "amiga_c" (C interpreter, big-endian 32-bit).
#
# The host tools (romgen, buildtool, MakeDeps, NativesTableGen) run on the
# Linux host (32-bit i386). The target part of this config is only used to
# GENERATE the target build tree (jvmconfig.h, incls/, merged sources,
# NativesTable.cpp, OopMaps.cpp). The actual cross compilation for
# AOS3 m68k / MorphOS / WarpOS is done by the amiga-j2me CMake build
# (vm/CMakeLists.txt), which reads the flags this config produces.
# GPLv2 only.

host_os   = linux
host_arch = i386
os_family = linux
compiler  = gcc

MakeDepsMain_amiga = UnixPlatform
MakeDepsOpts_amiga = -resolveVpath true

export ENABLE_C_INTERPRETER         := true
export ENABLE_C_INTERPRETER__BY     := amiga_c.cfg
export ENABLE_INTERPRETER_GENERATOR := false
export ENABLE_INTERPRETER_GENERATOR__BY := amiga_c.cfg
export ENABLE_COMPILER              := false
export ENABLE_COMPILER__BY          := amiga_c.cfg
export ENABLE_DEBUGGER              := false
export ENABLE_DEBUGGER__BY          := amiga_c.cfg
export ENABLE_DYNAMIC_NATIVE_METHODS := false
export ENABLE_DYNAMIC_NATIVE_METHODS__BY := amiga_c.cfg
export ENABLE_PCSL                  := false
export ENABLE_PCSL__BY              := amiga_c.cfg
export ENABLE_TIMER_THREAD          := true
export ENABLE_TIMER_THREAD__BY      := amiga_c.cfg
export ROMIZING                     := false

ifeq ($(IsLoopGen),true)
    arch = c
endif

ifeq ($(IsRomGen),true)
    # Runs on the HOST (little-endian i386): used for OopMaps only.
    arch = c
endif

ifeq ($(IsTarget),true)
    os_family = amiga
    arch      = c
    export HARDWARE_LITTLE_ENDIAN         := false
    export HARDWARE_LITTLE_ENDIAN__BY     := amiga_c.cfg
    export MSW_FIRST_FOR_DOUBLE           := true
    export MSW_FIRST_FOR_DOUBLE__BY       := amiga_c.cfg
    export MSW_FIRST_FOR_LONG             := true
    export MSW_FIRST_FOR_LONG__BY         := amiga_c.cfg
    export ENABLE_ROM_GENERATOR           := false
    export ENABLE_ROM_GENERATOR__BY       := amiga_c.cfg
    export SUPPORTS_MONOTONIC_CLOCK       := true
    CPP_DEF_FLAGS += -DAMIGA_J2ME=1
endif

MERGE_SOURCE_FILES = true
SOURCE_MERGER_SIZE = 35
